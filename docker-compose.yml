services:
  backend:
    build: ./backend
    container_name: toast-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://toast_user:toast_password@postgres:5432/toast_db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: toast-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:17-alpine
    container_name: toast-postgres
    environment:
      POSTGRES_USER: toast_user
      POSTGRES_PASSWORD: toast_password
      POSTGRES_DB: toast_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toast_user -d toast_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: