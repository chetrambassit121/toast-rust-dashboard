[package]
name = "backend"
version = "0.1.0"
edition = "2024"



[dependencies]
actix-web = "4"
dotenvy = "0.15"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }